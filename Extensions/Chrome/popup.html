<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FluxDownload</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>FluxDownload</h1>
  <p id="status">Checking desktop connection…</p>
  <label>
    <input type="checkbox" id="capture">
    Capture browser downloads
  </label>
  <h2>Captured on this tab</h2>
  <div id="formats">Play a video or audio file, then open this popup.</div>
  <button id="open">Refresh connection</button>
  <script src="popup.js"></script>
</body>
</html>
